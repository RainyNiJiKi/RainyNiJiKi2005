<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Texture AR | RainyNiJiKi2005</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #111; font-family: system-ui, sans-serif;
    }
    a-scene { width: 100%; height: 100%; }
    #panel {
      position: fixed; z-index: 10; top: 12px; left: 12px;
      width: min(310px, calc(100vw - 24px)); padding: 14px;
      color: #fff; background: rgba(20, 22, 30, .88);
      border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 17px; margin: 0 0 8px; }
    #status { font-size: 13px; line-height: 1.5; margin: 0 0 12px; color: #b9edca; }
    .control { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    input { flex: 1; min-width: 0; }
    button {
      margin-top: 12px; padding: 8px 11px; border: 1px solid #68708a;
      border-radius: 8px; background: #34394b; color: white; cursor: pointer;
    }
    .hint { margin: 10px 0 0; color: #c2c5d0; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Face Texture AR</h1>
    <p id="status">กำลังเปิดกล้องและโหลดภาพ UV…</p>
    <div class="control">
      <label for="opacity">ความทึบ</label>
      <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.85">
      <span id="opacityValue">0.85</span>
    </div>
    <button id="reset" type="button">คืนค่าความทึบ</button>
    <p class="hint">แสดงภาพ canonical face model UV บนตาข่ายใบหน้าที่ติดตามจากกล้อง ไม่ใช้โมเดล 3D อื่น</p>
  </div>

  <a-scene
    mindar-face="faceOccluder: false"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-entity id="face" mindar-face-default-face-occluder></a-entity>
    <a-camera active="false" position="0 0 0"></a-camera>
  </a-scene>

  <script>
    (() => {
      const scene = document.querySelector('a-scene');
      const face = document.querySelector('#face');
      const status = document.querySelector('#status');
      const opacityInput = document.querySelector('#opacity');
      const opacityValue = document.querySelector('#opacityValue');

      let faceMaterial = null;

      function setStatus(message, color = '#b9edca') {
        status.textContent = message;
        status.style.color = color;
      }

      function updateOpacity() {
        const value = Number(opacityInput.value);
        opacityValue.textContent = value.toFixed(2);
        if (faceMaterial) {
          faceMaterial.opacity = value;
          faceMaterial.needsUpdate = true;
        }
      }

      opacityInput.addEventListener('input', updateOpacity);
      document.querySelector('#reset').addEventListener('click', () => {
        opacityInput.value = '0.85';
        updateOpacity();
      });

      scene.addEventListener('arReady', () => {
        const THREE = AFRAME.THREE;
        const textureUrl = new URL('./canonical_face_model_uv_visualization.png', window.location.href).href;
        const loader = new THREE.TextureLoader();

        loader.load(
          textureUrl,
          (texture) => {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.flipY = false;

            const mesh = face.getObject3D('mesh');
            if (!mesh) {
              setStatus('ไม่พบ Face Mesh จาก MindAR กรุณารีเฟรชหน้าเว็บ', '#ffaaa5');
              console.error('MindAR face mesh was not found on #face.');
              return;
            }

            if (mesh.material) {
              if (Array.isArray(mesh.material)) {
                mesh.material.forEach((material) => material.dispose());
              } else {
                mesh.material.dispose();
              }
            }

            faceMaterial = new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              opacity: Number(opacityInput.value),
              side: THREE.DoubleSide,
              depthWrite: false
            });

            mesh.material = faceMaterial;
            mesh.frustumCulled = false;
            updateOpacity();
            setStatus('กล้องพร้อมแล้ว · กำลังแสดงภาพ UV บนใบหน้า');
          },
          undefined,
          (error) => {
            console.error('Could not load face texture:', error);
            setStatus('โหลดภาพ PNG ไม่สำเร็จ ตรวจสอบชื่อไฟล์และตำแหน่งใน GitHub', '#ffaaa5');
          }
        );
      });

      scene.addEventListener('arError', (event) => {
        console.error('MindAR error:', event);
        setStatus('เปิด AR ไม่สำเร็จ กรุณาอนุญาตใช้กล้องและเปิดผ่าน HTTPS', '#ffaaa5');
      });
    })();
  </script>
</body>
</html>
