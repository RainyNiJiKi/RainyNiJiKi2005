<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Mesh Texture AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100%; height: 100%; }
    #msg {
      position: fixed; z-index: 10; left: 12px; bottom: 12px; right: 12px;
      padding: 8px 12px; border-radius: 10px; background: #000a; color: #fff;
      font: 13px/1.4 system-ui, sans-serif; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="msg">กำลังเตรียมกล้อง… (กรุณากดอนุญาตการใช้กล้อง)</div>

  <a-scene mindar-face="faceOccluder: false" embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-entity id="face" mindar-face-default-face-occluder></a-entity>
    <a-camera active="false" position="0 0 0"></a-camera>
  </a-scene>

  <script>
    // ====== ตั้งค่าของคุณ ======
    // ไฟล์ภาพ texture ที่อัปโหลดไว้ใน repo (อยู่โฟลเดอร์เดียวกับไฟล์นี้)
    // ถ้าจะใช้รูปอื่น ให้อัปโหลดแล้วเปลี่ยนชื่อไฟล์ตรงนี้
    const TEXTURE_URL = './canonical_face_model_uv_visualization.png';
    // ภาพสำรอง กรณีไฟล์ด้านบนโหลดไม่ได้
    const FALLBACK_URL = 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/canonical_face_model_uv_visualization.png';
    const OPACITY = 0.85;   // 0 = โปร่งใส, 1 = ทึบ
    // ===========================

    const msg = document.getElementById('msg');

    document.querySelector('a-scene').addEventListener('arReady', () => {
      const THREE = AFRAME.THREE;
      const loader = new THREE.TextureLoader();

      const applyTexture = (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        const mesh = document.querySelector('#face').getObject3D('mesh');
        if (!mesh) { msg.textContent = 'ไม่พบ face mesh ลองรีเฟรชหน้าเว็บ'; return; }
        // เปลี่ยนวัสดุบังหน้าเป็น texture ของเรา (ไม่มีโมเดล .glb เข้ามาเกี่ยวข้อง)
        mesh.material.dispose();
        mesh.material = new THREE.MeshBasicMaterial({
          map: texture, transparent: true, opacity: OPACITY, side: THREE.DoubleSide
        });
        mesh.frustumCulled = false;
        msg.textContent = 'พร้อมใช้งาน · หันหน้าเข้าหากล้อง';
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
      };

      loader.load(
        TEXTURE_URL,
        applyTexture,
        undefined,
        () => {
          console.warn('โหลด', TEXTURE_URL, 'ไม่ได้ ใช้ภาพสำรองแทน');
          msg.textContent = 'โหลดภาพ ' + TEXTURE_URL + ' ไม่ได้ กำลังใช้ภาพสำรอง';
          loader.load(FALLBACK_URL, applyTexture, undefined, () => {
            msg.textContent = 'โหลดภาพ texture ไม่สำเร็จ ตรวจชื่อไฟล์และอินเทอร์เน็ต';
          });
        }
      );
    });
  </script>
</body>
</html>
