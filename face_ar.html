<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Low-poly Face Mask AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:transparent}
    a-scene{position:fixed!important;inset:0;width:100vw;height:100dvh;z-index:1}
    video{object-fit:cover}
    .mindar-ui-overlay{z-index:5}
    canvas.a-canvas{background:transparent!important}
    #panel{position:fixed;z-index:10;left:12px;right:12px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    button{border:0;border-radius:10px;padding:10px 14px;background:#eee4e4;color:#251c20;font-size:14px}
    #status{position:fixed;z-index:10;top:12px;left:12px;right:12px;text-align:center;color:white;text-shadow:0 1px 4px #000;background:#0007;padding:9px;border-radius:10px;font-size:14px}
  </style>
</head>
<body>
  <div id="status">กำลังเริ่มระบบติดตามใบหน้า…</div>
  <div id="panel">
    <button onclick="adjust('scale',-0.05)">เล็กลง</button>
    <button onclick="adjust('scale',0.05)">ใหญ่ขึ้น</button>
    <button onclick="adjust('y',-0.02)">เลื่อนขึ้น</button>
    <button onclick="adjust('y',0.02)">เลื่อนลง</button>
    <button onclick="resetMask()">รีเซ็ต</button>
  </div>
  <a-scene
    mindar-face="autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="maskModel" src="./face_mask_ar.glb"></a-asset-item>
    </a-assets>
    <!-- Anchor near the center of the face. Fine-tune position/scale with the controls. -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model id="mask" src="#maskModel" position="0 0 0.02" rotation="0 0 0" scale="0.58 0.58 0.58"></a-gltf-model>
    </a-entity>
    <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>
  <script>
    const mask = document.querySelector('#mask');
    const status = document.querySelector('#status');
    let baseScale = 0.58, offsetY = 0;
    function applyAdjustments(){
      if (!mask) return;
      mask.setAttribute('scale', `${baseScale} ${baseScale} ${baseScale}`);
      mask.setAttribute('position', `0 ${offsetY} 0.02`);
    }
    function adjust(kind, amount){
      if(kind === 'scale') baseScale = Math.max(0.15, Math.min(1.4, baseScale + amount));
      if(kind === 'y') offsetY = Math.max(-0.3, Math.min(0.3, offsetY + amount));
      applyAdjustments();
    }
    function resetMask(){ baseScale = 0.58; offsetY = 0; applyAdjustments(); }
    window.adjust = adjust;
    window.resetMask = resetMask;
    document.querySelector('a-scene').addEventListener('renderstart', () => {
      status.textContent = 'เปิดกล้องแล้ว — ขยับหน้าเพื่อทดสอบตำแหน่งหน้ากาก';
    });
    document.querySelector('a-scene').addEventListener('arReady', () => {
      status.textContent = 'ตรวจพบใบหน้าแล้ว';
    });
    document.querySelector('a-scene').addEventListener('arError', () => {
      status.textContent = 'เปิดกล้องไม่สำเร็จ กรุณาอนุญาต Camera และเปิดเว็บผ่าน HTTPS';
    });
    mask.addEventListener('model-error', () => {
      status.textContent = 'ไม่พบ face_mask_ar.glb กรุณาอัปโหลดไว้โฟลเดอร์เดียวกับไฟล์ HTML';
    });
  </script>
</body>
</html>
