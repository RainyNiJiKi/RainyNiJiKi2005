
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My MindAR Project</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Animation -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Load 3D Models -->
    <a-assets timeout="20000">

      <a-asset-item
        id="monk"
        src="./etrian_odyssey_3_monk.glb">
      </a-asset-item>

      <a-asset-item
        id="jello"
        src="./jiggly_watermelon_jello.glb">
      </a-asset-item>

      <a-asset-item
        id="matilda"
        src="./matilda.glb">
      </a-asset-item>

    </a-assets>

    <!-- Target 1: Monk -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#monk"
        position="0 0 0"
        rotation="90 0 0"
        scale="0.5 0.5 0.5"
        animation-mixer>
      </a-gltf-model>
    </a-entity>

    <!-- Target 2: Watermelon Jello -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model
        src="#jello"
        position="0 0 0"
        rotation="90 0 0"
        scale="0.5 0.5 0.5"
        animation-mixer>
      </a-gltf-model>
    </a-entity>

    <!-- Target 3: Matilda -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model
        src="#matilda"
        position="0 0 0"
        rotation="90 0 0"
        scale="0.5 0.5 0.5"
        animation-mixer>
      </a-gltf-model>
    </a-entity>

    <!-- Camera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>
</body>
</html>
