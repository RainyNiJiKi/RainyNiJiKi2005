<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My MindAR Project</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <script>
    // Normalize Matilda's size and origin so it remains visible even if
    // the GLB was exported with an unusually large scale or offset origin.
    AFRAME.registerComponent('normalize-gltf', {
      schema: { height: { type: 'number', default: 0.8 } },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          if (!root) {
            console.error('Matilda: model-loaded fired but no mesh was found.');
            return;
          }

          const bounds = new THREE.Box3().setFromObject(root);
          if (bounds.isEmpty()) {
            console.error('Matilda: the GLB loaded but contains no visible geometry.');
            return;
          }

          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          bounds.getSize(size);
          bounds.getCenter(center);
          const largestDimension = Math.max(size.x, size.y, size.z);

          if (!Number.isFinite(largestDimension) || largestDimension <= 0) {
            console.error('Matilda: invalid model dimensions.', size);
            return;
          }

          const factor = this.data.height / largestDimension;
          this.el.object3D.scale.setScalar(factor);
          this.el.object3D.position.set(
            -center.x * factor,
            -center.y * factor,
            -center.z * factor
          );
          console.info('Matilda loaded and normalized:', { size, factor });
        });

        this.el.addEventListener('model-error', (event) => {
          console.error('Failed to load matilda.glb:', event.detail || event);
        });
      }
    });
  </script>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="60000">
      <a-asset-item id="monk" src="./etrian_odyssey_3_monk.glb"></a-asset-item>
      <a-asset-item id="jello" src="./jiggly_watermelon_jello.glb"></a-asset-item>
      <a-asset-item id="matilda" src="./matilda.glb"></a-asset-item>
    </a-assets>

    <!-- Target 1: Monk -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#monk"
        position="0 0 0"
        rotation="90 0 0"
        scale="0.5 0.5 0.5"
        animation-mixer>
      </a-gltf-model>
    </a-entity>

    <!-- Target 2: Watermelon Jello -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model
        src="#jello"
        position="0 0 0"
        rotation="90 0 0"
        scale="0.5 0.5 0.5"
        animation-mixer>
      </a-gltf-model>
    </a-entity>

    <!-- Target 3: Matilda -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model
        src="#matilda"
        position="0 0 0"
        rotation="90 0 0"
        normalize-gltf="height: 0.8"
        animation-mixer>
      </a-gltf-model>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>
</body>
</html>
